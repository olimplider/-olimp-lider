<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e130e">
  <title>OLIMP-LIDER — Kirish</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="apple-touch-icon" href="/assets/logo.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OLIMP-LIDER">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* Critical CSS - inline to prevent FOUC */
    :root {
      --bg: #0a0d0a;
      --bg-grad: linear-gradient(135deg, #0a0d0a 0%, #0f172a 35%, #0a0d0a 100%);
      --card: rgba(255, 255, 255, 0.06);
      --card-2: rgba(255, 255, 255, 0.04);
      --card-3: rgba(255, 255, 255, 0.03);
      --card-4: rgba(255, 255, 255, 0.02);
      --ink: #f1f5f9;
      --ink-2: #cbd5e1;
      --muted: #94a3b8;
      --muted-2: #767e68;
      --gold: #d4af37;
      --gold-dim: #b8922e;
      --gold-soft: rgba(212, 175, 55, 0.16);
      --gold-soft-2: rgba(212, 175, 55, 0.06);
      --gold-grad: linear-gradient(135deg, #e8cc6e, #d4af37 55%, #ae8c26);
      --green: #58a946;
      --red: #c0392b;
      --blue: #3f6b8f;
      --crimson: #d84c4c;
      --code: #0b0e09;
      --text: #f1f5f9;
      --border: rgba(212, 175, 55, 0.35);
      --border-soft: rgba(212, 175, 55, 0.10);
      --line: #2c3424;
      --line-soft: rgba(212, 175, 55, 0.10);
      --radius-sm: 8px;
      --radius: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 16px 34px -14px rgba(0, 0, 0, 0.65);
      --shadow-lg: 0 2px 4px rgba(0, 0, 0, 0.5), 0 34px 70px -20px rgba(0, 0, 0, 0.8);
      --ring: 0 0 0 3px rgba(212, 175, 55, 0.35);
      --ring-danger: 0 0 0 3px rgba(192, 57, 43, 0.3);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --acc: #d4af37;
      --acc-deep: #9a7b22;
      --acc-2: #e8cc6e;
      --gold-2: #e8cc6e;
      --gold-soft-b: rgba(212, 175, 55, 0.18);
      --acc-soft: rgba(212, 175, 55, 0.14);
      --green-soft: rgba(88, 169, 70, 0.16);
      --red-soft: rgba(192, 57, 43, 0.16);
      --blue-soft: rgba(63, 107, 143, 0.24);
      --amber-soft: rgba(255, 190, 70, 0.15);
      --purple-soft: rgba(146, 110, 196, 0.2);
      --bg-grad-a: rgba(212, 175, 55, 0.06);
      --bg-grad-b: rgba(46, 62, 34, 0.12);
      --bg-grad-c: rgba(5, 7, 10, 0.82);
      --card-gradient: linear-gradient(165deg, rgba(255, 255, 255, 0.06), rgba(16, 21, 14, 0.82));
      --card-velvet: rgba(16, 21, 14, 0.82);
      --backdrop: rgba(4, 6, 4, 0.62);
      --blur: blur(12px) saturate(100%);
      --border-ok: #d4af37;
      --success: #58a946;
      --success-light: rgba(88, 169, 70, 0.16);
      --danger: #c0392b;
      --text-muted: #9aa488;
    }
    html { background-color: var(--bg); }
    body { background: var(--bg-grad); color: var(--ink); margin: 0; }
    * { touch-action: manipulation; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="insignia">
        <div class="radar"></div>
        <img src="/assets/logo.png" class="logo-img" alt="OLIMP-LIDER logotipi">
      </div>
      <h1 class="welcome-title">OLIMP-LIDER MAXSUS SPORT KLUBI SAYTIGA XUSH KELIBSIZ</h1>
      <div id="errorBox" class="alert-error"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Login</label>
          <input type="text" id="username" placeholder="Login" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </div>
        <div class="form-group">
          <label for="password">Parol</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="Parol" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Parolni ko'rsatish/yashirish"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Kirish</button>
      </form>
      <div style="margin-top:14px;font-size:13px;color:var(--text-muted);line-height:1.6">
        <b>Kirish ma'lumotlaringiz yetmayaptimi?</b><br>
        Ota-ona va o'qituvchi login-parollari administrator tomonidan beriladi.
        Maktab ma'muridan so'rang: O'quvchilar → "Ota-ona" (parolni yangilash) yoki O'qituvchilar → "Kirish ma'lumotlari".
      </div>
      <div id="contactLine" style="margin-top:16px"></div>
      <div class="clock-box login-clock" id="clock"></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    initContact('contactLine');
    initClock('clock');

    // Panel manzillari faqat serverdan keladi (kirish qilgan odamga ko'rinadi)
    if (API.getToken()) {
      fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + API.getToken() } })
        .then((r) => (r.ok ? r.json() : null))
        .then((d) => { if (d && d.redirect) window.location.href = d.redirect; else API.setToken(null); })
        .catch(() => API.setToken(null));
    }

    document.getElementById('togglePass').addEventListener('click', () => {
      const p = document.getElementById('password');
      const show = p.type === 'password';
      p.type = show ? 'text' : 'password';
      document.getElementById('togglePass').innerHTML = show
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
      p.focus();
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('errorBox');
      const btn = document.getElementById('loginBtn');
      errorBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      btn.disabled = true;
      btn.textContent = 'Tekshirilmoqda...';
      try {
        const data = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        }).then((r) => r.json());

        if (!data.token) throw new Error(data.error || 'Xato');
        API.setToken(data.token);
        localStorage.setItem('role', data.role);
        localStorage.setItem('fullName', data.fullName || '');
        localStorage.setItem('branch_id', data.branch_id || '');
        localStorage.setItem('branch_name', data.branch_name || '');
        window.location.href = data.redirect || LOGIN_URL;
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Kirish';
      }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.log('SW registration failed:', err));
    }
  </script>
</body>
</html>
