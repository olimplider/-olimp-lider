<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e130e">
  <title>OLIMP-LIDER — Shifokor paneli</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="apple-touch-icon" href="/assets/logo.png">
<link rel="stylesheet" href="/css/style.css">
  <style>
    /* Critical CSS - inline to prevent FOUC */
    :root {
      --bg: #0a0d0a;
      --bg-grad: linear-gradient(135deg, #0a0d0a 0%, #0f172a 45%, #0a0d0a 100%);
      --ink: #f1f5f9;
      --ink-2: #cbd5e1;
      --muted: #94a3b8;
      --gold: #d4af37;
      --gold-soft: rgba(212, 175, 55, 0.16);
      --border: rgba(212, 175, 55, 0.35);
      --radius-lg: 20px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --text: #f1f5f9;
      --text-muted: #9aa488;
      --success: #58a946;
      --danger: #c0392b;
    }
    html { background-color: var(--bg); }
    body { background: var(--bg-grad); color: var(--ink); margin: 0; }
    * { touch-action: manipulation; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="/assets/logo.png" class="brand-logo" alt="logotip">
        <div>
          <h2>OLIMP-LIDER</h2>
          <span>Shifokor paneli</span>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-section="dashboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span class="text">Dashbord</span></button>
        <button class="nav-item" data-section="medical"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span class="text">086-formalar</span></button>
        <button class="nav-item" data-section="health"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><span class="text">Kunlik tekshiruv</span></button>
        <button class="nav-item" data-section="chat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="text">Xabarlar</span></button>
      </nav>
      <div class="sidebar-footer">
        <div id="contactLinks"></div>
        <div class="user-info" id="userInfo"></div>
        <button class="nav-item" id="logoutBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span class="text">Chiqish</span></button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <h1 id="pageTitle">Dashbord</h1>
        <button class="btn btn-outline refresh-btn" onclick="window.appRefresh()" title="Joriy bo'limni joyidan chiqmasdan yangilash"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg><span class="refresh-label">Yangilash</span></button>
        <div class="clock-box" id="clock"></div>
        <div id="topbarActions"></div>
      </div>
      <div class="contact-strip" id="contactTop"></div>
      <div class="content" id="content"><div class="empty-state">Yuklanmoqda...</div></div>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/doctor.js"></script>
</body>
</html>
