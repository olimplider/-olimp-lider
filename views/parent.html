<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e9eef3">
  <title>OLIMP-LIDER — Ota-ona paneli</title>
  <link rel="icon" type="image/png" href="/assets/logo-emblem.png">
  <link rel="apple-touch-icon" href="/assets/logo-emblem.png">
<link rel="stylesheet" href="/css/style.css">
  <style>
    /* Critical CSS - inline to prevent FOUC */
    :root {
      --bg: #e9eef3;
      --bg-grad: linear-gradient(165deg, #eef2f7 0%, #e9eef3 45%, #e5ebf2 100%);
      --card: rgba(255, 255, 255, 0.66);
      --card-2: rgba(255, 255, 255, 0.58);
      --card-3: rgba(255, 255, 255, 0.48);
      --card-4: rgba(255, 255, 255, 0.36);
      --ink: #2c3339;
      --ink-2: #39414a;
      --muted: #5b656d;
      --muted-2: #6b7264;
      --gold: #d4af37;
      --gold-ink: #7f6419;
      --gold-dim: #b8922e;
      --gold-soft: rgba(212, 175, 55, 0.16);
      --gold-soft-2: rgba(212, 175, 55, 0.07);
      --gold-grad: linear-gradient(135deg, #e8cc6e, #d4af37 55%, #ae8c26);
      --green: #2f7d33;
      --red: #b0342a;
      --blue: #2f6f97;
      --crimson: #d84c4c;
      --code: #eef1f6;
      --text: #2c3339;
      --border: rgba(23, 42, 64, 0.12);
      --border-soft: rgba(23, 42, 64, 0.07);
      --border-field: #87909c;
      --line: rgba(23, 42, 64, 0.14);
      --line-soft: rgba(23, 42, 64, 0.08);
      --focus: #8a6d1f;
      --radius-sm: 10px;
      --radius: 16px;
      --radius-lg: 22px;
      --radius-xl: 28px;
      --shadow-sm: 0 1px 2px rgba(23, 42, 64, 0.05);
      --shadow: 0 1px 2px rgba(23, 42, 64, 0.05), 0 14px 30px -16px rgba(23, 42, 64, 0.18);
      --shadow-lg: 0 2px 4px rgba(23, 42, 64, 0.05), 0 32px 64px -28px rgba(23, 42, 64, 0.28);
      --ring: 0 0 0 3px rgba(138, 109, 31, 0.3);
      --ring-danger: 0 0 0 3px rgba(176, 52, 42, 0.25);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --acc: #d4af37;
      --acc-deep: #7f6419;
      --acc-2: #e8cc6e;
      --gold-2: #e8cc6e;
      --gold-soft-b: rgba(212, 175, 55, 0.18);
      --acc-soft: rgba(212, 175, 55, 0.14);
      --green-soft: rgba(88, 169, 70, 0.14);
      --red-soft: rgba(192, 57, 43, 0.12);
      --blue-soft: rgba(63, 107, 143, 0.14);
      --amber-soft: rgba(255, 190, 70, 0.18);
      --purple-soft: rgba(146, 110, 196, 0.14);
      --bg-grad-a: rgba(212, 175, 55, 0.08);
      --bg-grad-b: rgba(46, 62, 34, 0.06);
      --bg-grad-c: rgba(5, 7, 10, 0.03);
      --card-gradient: linear-gradient(165deg, rgba(255,255,255,.72), rgba(255,255,255,.55));
      --card-velvet: rgba(255, 255, 255, 0.72);
      --backdrop: rgba(23, 42, 64, 0.40);
      --blur: blur(16px) saturate(150%);
      --border-ok: #7f6419;
      --success: #2f7d33;
      --success-light: rgba(88, 169, 70, 0.14);
      --danger: #b0342a;
      --text-muted: #5b656d;
      --btn-bg: rgba(255, 255, 255, 0.72);
      --btn-border: rgba(138, 109, 31, 0.55);
    }
    html { background-color: var(--bg); }
    body { background: var(--bg-grad); color: var(--ink); margin: 0; }
    * { touch-action: manipulation; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="/assets/logo-emblem.png" class="brand-logo" alt="logotip">
        <div>
          <h2>OLIMP-LIDER</h2>
          <span>Ota-ona paneli</span>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item" data-section="overview"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span class="text">Umumiy holat</span></button>
        <button class="nav-item" data-section="student"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/><path d="m16 11 1.5 1.5L21 9"/></svg><span class="text">Farzand</span></button>
        <button class="nav-item" data-section="grades"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 7h7"/><path d="M9 11h5"/></svg><span class="text">Baholar</span></button>
        <button class="nav-item" data-section="attendance"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="m9 16 2 2 4-4"/></svg><span class="text">Davomat</span></button>
        <button class="nav-item" data-section="schedule"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h3v3H8z"/><path d="M13 14h3v3h-3z"/></svg><span class="text">Dars jadvali</span></button>
        <button class="nav-item" data-section="diary"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 5h7"/><path d="M9 9h6"/><path d="M9 13h4"/></svg><span class="text">Kundalik</span></button>
        <button class="nav-item" data-section="teachers"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="text">O'qituvchilar</span></button>
        <button class="nav-item" data-section="payments"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span class="text">To'lovlar</span></button>
        <button class="nav-item" data-section="chat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="text">Xabarlar</span></button>
      </nav>
      <div class="sidebar-footer">
        <div id="contactLinks"></div>
        <div class="user-info" id="userInfo"></div>
        <button class="nav-item" id="logoutBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span class="text">Chiqish</span></button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <h1 id="pageTitle">Umumiy holat</h1>
        <button class="btn btn-outline refresh-btn" onclick="window.appRefresh()" title="Joriy bo'limni joyidan chiqmasdan yangilash"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg><span class="refresh-label">Yangilash</span></button>
        <div class="clock-box" id="clock"></div>
      </div>
      <div class="contact-strip" id="contactTop"></div>
      <div class="content"><div id="tgBar" class="tg-bar-host"></div><div id="content"><div class="empty-state">Yuklanmoqda...</div></div></div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/parent.js"></script>
</body>
</html>
