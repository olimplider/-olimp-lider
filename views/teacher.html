<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#12161c">
  <title>OLIMP-LIDER — O'qituvchi paneli</title>
  <link rel="icon" type="image/png" href="/assets/logo-emblem.png">
  <link rel="apple-touch-icon" href="/assets/logo-emblem.png">
<link rel="stylesheet" href="/css/style.css">
  <style>
    /* Critical CSS - inline to prevent FOUC */
    :root {
      --bg: #12161c;
      --bg-grad: linear-gradient(165deg, #171c24 0%, #12161c 45%, #0f1319 100%);
      --card: rgba(43, 50, 59, 0.72);
      --card-2: rgba(38, 45, 54, 0.72);
      --card-3: rgba(34, 40, 49, 0.72);
      --card-4: rgba(30, 36, 44, 0.72);
      --ink: #e7eaee;
      --ink-2: #cfd6dd;
      --muted: #a3adb8;
      --muted-2: #6b7264;
      --gold: #d4af37;
      --gold-ink: #d4af37;
      --gold-dim: #b8922e;
      --gold-soft: rgba(212, 175, 55, 0.16);
      --gold-soft-2: rgba(212, 175, 55, 0.07);
      --gold-grad: linear-gradient(135deg, #e8cc6e, #d4af37 55%, #ae8c26);
      --green: #58a946;
      --red: #e06c6c;
      --blue: #5b9bd5;
      --crimson: #d84c4c;
      --code: #1c2129;
      --text: #e7eaee;
      --border: rgba(255, 255, 255, 0.10);
      --border-soft: rgba(255, 255, 255, 0.06);
      --border-field: #7d8896;
      --line: rgba(255, 255, 255, 0.12);
      --line-soft: rgba(255, 255, 255, 0.07);
      --focus: #e8cc6e;
      --radius-sm: 10px;
      --radius: 16px;
      --radius-lg: 22px;
      --radius-xl: 28px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.30);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.30), 0 14px 30px -16px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 2px 4px rgba(0, 0, 0, 0.30), 0 32px 64px -28px rgba(0, 0, 0, 0.55);
      --ring: 0 0 0 3px rgba(232, 204, 110, 0.35);
      --ring-danger: 0 0 0 3px rgba(176, 52, 42, 0.25);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --acc: #d4af37;
      --acc-deep: #d4af37;
      --acc-2: #e8cc6e;
      --gold-2: #e8cc6e;
      --gold-soft-b: rgba(212, 175, 55, 0.18);
      --acc-soft: rgba(212, 175, 55, 0.14);
      --green-soft: rgba(88, 169, 70, 0.14);
      --red-soft: rgba(192, 57, 43, 0.12);
      --blue-soft: rgba(63, 107, 143, 0.14);
      --amber-soft: rgba(255, 190, 70, 0.18);
      --purple-soft: rgba(146, 110, 196, 0.14);
      --bg-grad-a: rgba(212, 175, 55, 0.08);
      --bg-grad-b: rgba(46, 62, 34, 0.06);
      --bg-grad-c: rgba(5, 7, 10, 0.03);
      --card-gradient: linear-gradient(165deg, rgba(50,58,68,.78), rgba(40,47,56,.65));
      --card-velvet: rgba(47, 55, 65, 0.80);
      --backdrop: rgba(6, 8, 12, 0.60);
      --blur: blur(22px) saturate(140%);
      --border-ok: #d4af37;
      --success: #58a946;
      --success-light: rgba(88, 169, 70, 0.14);
      --danger: #e06c6c;
      --text-muted: #a3adb8;
      --btn-bg: rgba(255, 255, 255, 0.07);
      --btn-border: rgba(212, 175, 55, 0.45);
    }
    html { background-color: var(--bg); }
    body { background: var(--bg-grad); color: var(--ink); margin: 0; }
    * { touch-action: manipulation; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="/assets/logo-emblem.png" class="brand-logo" alt="logotip">
        <div>
          <h2>OLIMP-LIDER</h2>
          <span>O'qituvchi paneli</span>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-section="dashboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span class="text">Dashbord</span></button>
        <button class="nav-item" data-section="grades"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 7h7"/><path d="M9 11h5"/></svg><span class="text">Baholar</span></button>
        <button class="nav-item" data-section="attendance"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="m9 16 2 2 4-4"/></svg><span class="text">Davomat</span></button>
        <button class="nav-item" data-section="schedule"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h3v3H8z"/><path d="M13 14h3v3h-3z"/></svg><span class="text">Dars jadvali</span></button>
        <button class="nav-item" data-section="tests"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M3 3h13v18H3z"/><path d="M13 3v5h5"/><path d="M8 11h4"/><path d="M8 15h4"/></svg><span class="text">Nazorat</span></button>
        <button class="nav-item" data-section="stats"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span class="text">Statistika</span></button>
        <button class="nav-item" data-section="chat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="text">Xabarlar</span></button>
      </nav>
      <div class="sidebar-footer">
        <div id="contactLinks"></div>
        <div class="user-info" id="userInfo"></div>
        <button class="nav-item" id="logoutBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span class="text">Chiqish</span></button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <h1 id="pageTitle">Dashbord</h1>
        <button class="btn btn-outline refresh-btn" onclick="window.appRefresh()" title="Joriy bo'limni joyidan chiqmasdan yangilash"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg><span class="refresh-label">Yangilash</span></button>
        <div class="clock-box" id="clock"></div>
        <div id="topbarActions"></div>
      </div>
      <div class="contact-strip" id="contactTop"></div>
      <div class="content" id="content"><div class="empty-state">Yuklanmoqda...</div></div>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/teacher.js"></script>
</body>
</html>
