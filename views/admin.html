      --muted-2: #6b7264;
      --gold: #d4af37;
      --gold-ink: #7f6419;
      --gold-dim: #b8922e;
      --gold-soft: rgba(212, 175, 55, 0.16);
      --gold-soft-2: rgba(212, 175, 55, 0.07);
      --gold-grad: linear-gradient(135deg, #e8cc6e, #d4af37 55%, #ae8c26);
      --green: #2f7d33;
      --red: #b0342a;
      --blue: #2f6f97;
      --crimson: #d84c4c;
      --code: #eef1f6;

      --ring-danger: 0 0 0 3px rgba(176, 52, 42, 0.25);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);

      --bg-grad-c: rgba(5, 7, 10, 0.03);
      --card-gradient: linear-gradient(165deg, rgba(255,255,255,.72), rgba(255,255,255,.55));
      --card-velvet: rgba(255, 255, 255, 0.72);
      --backdrop: rgba(23, 42, 64, 0.40);
      --blur: blur(16px) saturate(150%);
      --border-ok: #7f6419;
      --success: #2f7d33;
      --success-light: rgba(88, 169, 70, 0.14);
      --danger: #b0342a;
      --text-muted: #5b656d;
      --btn-bg: rgba(255, 255, 255, 0.72);
      --btn-border: rgba(138, 109, 31, 0.55);
    }
    html { background-color: var(--bg); }
    body { background: var(--bg-grad); color: var(--ink); margin: 0; }
    * { touch-action: manipulation; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  </style>

<script>
if ('serviceWorker' in navigator) {
  // Yangilanish topilsa darhol almashadi — eski JS keshda qolmaydi
  navigator.serviceWorker.register('/sw.js').then(reg => {
    reg.update();
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', () => {
        if (nw.state === 'activated' && navigator.serviceWorker.controller) {
          window.__swUpdated = true;
        }
      });
    });
  }).catch(err => console.log('SW registration failed:', err));

  // Yangi servis worker ishga tushganda sahifani bir marta qayta yuklaymiz,
  // shunda foydalanuvchi hech narsa bosmasa ham yangi kod yuklanadi.
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded) return;
    reloaded = true;
    location.reload();
  });
}
</script>
