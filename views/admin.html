  <style>
    /* Critical CSS - inline to prevent FOUC */
    :root {
      --bg: #0a0d0a;
      --bg-grad: linear-gradient(135deg, #0a0d0a 0%, #0f172a 45%, #0a0d0a 100%);
      --card: rgba(255, 255, 255, 0.06);
      --card-2: rgba(255, 255, 255, 0.04);
      --card-3: rgba(255, 255, 255, 0.03);
      --card-4: rgba(255, 255, 255, 0.02);
      --ink: #f1f5f9;
      --ink-2: #cbd5e1;
      --muted: #94a3b8;
      --muted-2: #767e68;
      --gold: #d4af37;
      --gold-dim: #b8922e;
      --gold-soft: rgba(212, 175, 55, 0.16);
      --gold-soft-2: rgba(212, 175, 55, 0.06);
      --gold-grad: linear-gradient(135deg, #e8cc6e, #d4af37 55%, #ae8c26);
      --green: #58a946;
      --red: #c0392b;
      --blue: #3f6b8f;
      --crimson: #d84c4c;
      --code: #0b0e09;
      --text: #f1f5f9;
      --border: rgba(212, 175, 55, 0.35);
      --border-soft: rgba(212, 175, 55, 0.10);
      --line: #2c3424;
      --line-soft: rgba(212, 175, 55, 0.10);
      --radius-sm: 8px;
      --radius: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 16px 34px -14px rgba(0, 0, 0, 0.65);
      --shadow-lg: 0 2px 4px rgba(0, 0, 0, 0.5), 0 34px 70px -20px rgba(0, 0, 0, 0.8);
      --ring: 0 0 0 3px rgba(212, 175, 55, 0.35);
      --ring-danger: 0 0 0 3px rgba(192, 57, 43, 0.3);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --acc: #d4af37;
      --acc-deep: #9a7b22;
      --acc-2: #e8cc6e;
      --gold-2: #e8cc6e;
      --gold-soft-b: rgba(212, 175, 55, 0.18);
      --acc-soft: rgba(212, 175, 55, 0.14);
      --green-soft: rgba(88, 169, 70, 0.16);
      --red-soft: rgba(192, 57, 43, 0.16);
      --blue-soft: rgba(63, 107, 143, 0.24);
      --amber-soft: rgba(255, 190, 70, 0.15);
      --purple-soft: rgba(146, 110, 196, 0.2);
      --bg-grad-a: rgba(212, 175, 55, 0.06);
      --bg-grad-b: rgba(46, 62, 34, 0.12);
      --bg-grad-c: rgba(5, 7, 10, 0.82);
      --card-gradient: linear-gradient(165deg, rgba(255, 255, 255, 0.06), rgba(16, 21, 14, 0.82));
      --card-velvet: rgba(16, 21, 14, 0.82);
      --backdrop: rgba(4, 6, 4, 0.62);
      --blur: blur(12px) saturate(100%);
      --border-ok: #d4af37;
      --success: #58a946;
      --success-light: rgba(88, 169, 70, 0.16);
      --danger: #c0392b;
      --text-muted: #9aa488;
      --blur: blur(12px) saturate(100%);
    }
    html { background-color: var(--bg); }
    .panel { opacity: 1 !important; visibility: visible !important; display: block !important; }
    .stat-card { opacity: 1 !important; visibility: visible !important; display: flex !important; }
    .panel { opacity: 1 !important; visibility: visible !important; display: block !important; }
    .stat-card { opacity: 1 !important; visibility: visible !important; display: flex !important; }
    @media (max-width: 900px) {
      .panel { opacity: 1 !important; visibility: visible !important; display: block !important; }
      .stat-card { opacity: 1 !important; visibility: visible !important; display: flex !important; }
    }
    * { touch-action: manipulation; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .modal-close { width: 44px; height: 44px; }
    .btn { min-height: 44px; padding: 12px 16px; border-radius: 12px; }
    .btn-sm { min-height: 36px; padding: 8px 12px; }
    input, select, textarea, .toolbar input.date-pick, .toolbar select { font-size: 16px !important; }
    .btn { min-height: 44px; padding: 12px 16px; border-radius: 12px; }
    .btn-sm { min-height: 36px; padding: 8px 12px; }
    .modal-close { width: 44px; height: 44px; }
    .modal-close { width: 44px; height: 44px; }
    .btn { min-height: 44px; padding: 12px 16px; border-radius: 12px; }
    .btn-sm { min-height: 36px; padding: 8px 12px; }
    .form-group input, .form-group select, .form-group textarea { min-height: 44px; }

      <div class="sidebar-footer">
        <div id="contactLinks"></div>
        <div class="user-info" id="userInfo"></div>
        <button class="sidebar-close" aria-label="Menyuni yopish" onclick="window.appSidebarClose()">

    <main class="main">

      </div>
      <div class="contact-strip" id="contactTop"></div>
      <div class="content" id="content"><div class="empty-state">Yuklanmoqda...</div></div>

  <!-- Modallar -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>

<script>
