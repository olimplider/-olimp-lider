<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLIMP-LIDER — Kirish</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="insignia">
        <div class="radar"></div>
        <img src="/assets/logo.png" class="logo-img" alt="OLIMP-LIDER logotipi">
      </div>
      <h1 class="welcome-title">OLIMP-LIDER MAXSUS SPORT KLUBI SAYTIGA XUSH KELIBSIZ</h1>
      <div id="errorBox" class="alert-error"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Login</label>
          <input type="text" id="username" placeholder="Kirish logini" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Parol</label>
          <input type="password" id="password" placeholder="Parol" autocomplete="current-password" required>
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Kirish</button>
      </form>
      <div style="margin-top:14px;font-size:13px;color:var(--text-muted);line-height:1.6">
        <b>Kirish ma'lumotlaringiz yetmayaptimi?</b><br>
        Ota-ona va o'qituvchi login-parollari administrator tomonidan beriladi.
        Maktab ma'muridan so'rang: O'quvchilar → "Ota-ona" (parolni yangilash) yoki O'qituvchilar → "Kirish ma'lumotlari".
      </div>
      <div id="contactLine" style="margin-top:16px"></div>
      <div class="clock-box login-clock" id="clock"></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    initContact('contactLine');
    initClock('clock');

    const roleOf = (role) => (role === 'admin' ? '/admin.html' : role === 'teacher' ? '/teacher.html' : '/parent.html');
    if (API.getToken()) {
      const role = API.getRole();
      window.location.href = roleOf(role);
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('errorBox');
      const btn = document.getElementById('loginBtn');
      errorBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Tekshirilmoqda...';
      try {
        const data = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        }).then((r) => r.json());

        if (!data.token) throw new Error(data.error || 'Xato');
        API.setToken(data.token);
        localStorage.setItem('role', data.role);
        localStorage.setItem('fullName', data.fullName || '');
        window.location.href = roleOf(data.role);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Kirish';
      }
    });
  </script>
</body>
</html>
