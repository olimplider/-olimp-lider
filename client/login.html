<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#10150c">
  <title>OLIMP-LIDER — Kirish</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="insignia">
        <div class="radar"></div>
        <img src="/assets/logo.png" class="logo-img" alt="OLIMP-LIDER logotipi">
      </div>
      <h1 class="welcome-title">OLIMP-LIDER MAXSUS SPORT KLUBI SAYTIGA XUSH KELIBSIZ</h1>
      <div id="errorBox" class="alert-error"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Login</label>
          <input type="text" id="username" placeholder="Login" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </div>
        <div class="form-group">
          <label for="password">Parol</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="Parol" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Parolni ko'rsatish/yashirish"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Kirish</button>
      </form>
      <div style="margin-top:14px;font-size:13px;color:var(--text-muted);line-height:1.6">
        <b>Kirish ma'lumotlaringiz yetmayaptimi?</b><br>
        Ota-ona va o'qituvchi login-parollari administrator tomonidan beriladi.
        Maktab ma'muridan so'rang: O'quvchilar → "Ota-ona" (parolni yangilash) yoki O'qituvchilar → "Kirish ma'lumotlari".
      </div>
      <div id="contactLine" style="margin-top:16px"></div>
      <div class="clock-box login-clock" id="clock"></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    initContact('contactLine');
    initClock('clock');

    const roleOf = (role) => (role === 'admin' ? '/admin.html' : role === 'teacher' ? '/teacher.html' : role === 'doctor' ? '/doctor.html' : '/parent.html');
    if (API.getToken()) {
      const role = API.getRole();
      window.location.href = roleOf(role);
    }

    document.getElementById('togglePass').addEventListener('click', () => {
      const p = document.getElementById('password');
      const show = p.type === 'password';
      p.type = show ? 'text' : 'password';
      document.getElementById('togglePass').innerHTML = show
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
      p.focus();
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('errorBox');
      const btn = document.getElementById('loginBtn');
      errorBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      btn.disabled = true;
      btn.textContent = 'Tekshirilmoqda...';
      try {
        const data = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        }).then((r) => r.json());

        if (!data.token) throw new Error(data.error || 'Xato');
        API.setToken(data.token);
        localStorage.setItem('role', data.role);
        localStorage.setItem('fullName', data.fullName || '');
        window.location.href = roleOf(data.role);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Kirish';
      }
    });
  </script>
</body>
</html>
