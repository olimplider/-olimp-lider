<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLIMP-LIDER — O'qituvchi paneli</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="/assets/logo.png" class="brand-logo" alt="logotip">
        <div>
          <h2>OLIMP-LIDER</h2>
          <span>O'qituvchi paneli</span>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-section="dashboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span class="text">Dashbord</span></button>
        <button class="nav-item" data-section="grades"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 7h7"/><path d="M9 11h5"/></svg><span class="text">Baholar</span></button>
        <button class="nav-item" data-section="attendance"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="m9 16 2 2 4-4"/></svg><span class="text">Davomat</span></button>
        <button class="nav-item" data-section="tests"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M3 3h13v18H3z"/><path d="M13 3v5h5"/><path d="M8 11h4"/><path d="M8 15h4"/></svg><span class="text">Nazorat</span></button>
        <button class="nav-item" data-section="stats"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span class="text">Statistika</span></button>
      </nav>
      <div class="sidebar-footer">
        <div id="contactLinks"></div>
        <div class="user-info" id="userInfo"></div>
        <button class="nav-item" id="logoutBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span class="text">Chiqish</span></button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <h1 id="pageTitle">Dashbord</h1>
        <div id="topbarActions"></div>
      </div>
      <div class="contact-strip" id="contactTop"></div>
      <div class="content" id="content"><div class="empty-state">Yuklanmoqda...</div></div>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/teacher.js"></script>
</body>
</html>
